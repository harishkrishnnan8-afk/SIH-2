# Render Blueprint for SIH26263 APAAR ID-Based Student Data Management Platform
# Automatic provisioning of Managed PostgreSQL, FastAPI Backend, and TanStack Start Frontend.
databases:
  - name: apaar-db
    databaseName: apaar_db
    user: apaar_user
    plan: free
    region: oregon

services:
  # FastAPI Backend Web Service
  - type: web
    name: apaar-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m scripts.init_db && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: apaar-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: SIMULATED_VERIFICATION_ONLY
        value: "true"

  # TanStack Start SSR Frontend Web Service
  - type: web
    name: apaar-frontend
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && NITRO_PRESET=node-server npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NITRO_PRESET
        value: node-server
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: apaar-backend
          property: host
